services:
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.4
    ports:
      - "127.0.0.1:13306:3306"
    env_file:
      - .runtime/mysql.env
    volumes:
      - forgepilot_ontology_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  forgepilot_ontology_mysql:
