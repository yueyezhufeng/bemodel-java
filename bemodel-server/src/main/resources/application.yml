server:
  address: 127.0.0.1
  port: ${FORGEPILOT_MODEL_PORT:18081}

spring:
  application:
    name: forgepilot-ontology
  profiles:
    default: forgepilot
  config.import:
    - optional:file:.env.properties
    - optional:file:../.env.properties
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/forgepilot_industrial?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/industrial
    baseline-on-migrate: false
  web:
    resources:
      static-locations: ${FORGEPILOT_WEB_LOCATION:file:../bemodel-web/dist/}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

deepseek:
  base-url: https://api.deepseek.com
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-v4-flash
  timeout-seconds: 30
  max-tokens: 4096
  call-timeouts:
    MAPPING_SUGGEST: 90
  backup:
    base-url: ${DEEPSEEK_BACKUP_BASE_URL:}
    api-key: ${DEEPSEEK_BACKUP_API_KEY:}
    model: ${DEEPSEEK_BACKUP_MODEL:}
  call-primary-route: {}

jwt:
  secret: ${JWT_SECRET:}
app:
  secret-key: ${APP_SECRET_KEY:}

bemodel:
  domain-context: 工业供应链管理
  mapping:
    llm-batch-size: 25
    top-k-concepts: 25
    llm-budget-seconds: 280
  proposal:
    cron: "-"

knowledge:
  chunk:
    size: 500
    overlap: 50
  embedding:
    base-url: ${EMBEDDING_BASE_URL:http://localhost:11434/v1}
    model: ${EMBEDDING_MODEL:bge-m3}
    timeout-ms: 3000
    api-key: ${EMBEDDING_API_KEY:}

logging:
  level:
    com.bemodel: info
